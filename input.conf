# Episode navigation
PGDWN script-binding uosc/next-file;show-text "下一集" 1200
PGUP script-binding uosc/prev-file;show-text "上一集" 1200
KP_PGDWN script-binding uosc/next-file;show-text "下一集" 1200
KP_PGUP script-binding uosc/prev-file;show-text "上一集" 1200

# Danmaku controls
j script-message show_danmaku_keyboard
Ctrl+Shift+d script-message open_add_total_menu
Ctrl+Shift+s script-message immediately_save_danmaku
Ctrl+Shift+y script-message open_danmaku_style_menu

# Anime4K shader chain
Ctrl+1 set glsl-shaders "~~/shaders/Anime4K_Clamp_Highlights.glsl;~~/shaders/Anime4K_Restore_CNN_M.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl";show-text "Anime4K: enabled" 2000
Ctrl+2 set glsl-shaders "";show-text "Anime4K: disabled" 2000

# mpv GPU interpolation (not RIFE)
Ctrl+f cycle interpolation;show-text "GPU interpolation: ${interpolation}" 2000
Ctrl+3 set interpolation yes;show-text "GPU interpolation: enabled" 2000
Ctrl+4 set interpolation no;show-text "GPU interpolation: disabled" 2000
I script-binding stats/display-stats
