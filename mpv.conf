# Standalone mpv + uosc_danmaku configuration
profile=gpu-hq
vo=gpu-next
gpu-api=d3d11
gpu-context=d3d11
d3d11-flip=no
d3d11-sync-interval=1
hwdec=nvdec-copy
hwdec-codecs=all
video-sync=display-resample
interpolation=yes
tscale=oversample
save-position-on-quit=yes
resume-playback=yes
watch-later-dir=~~/watch_later
write-filename-in-watch-later-config=yes
no-osc
keep-open=no
# Anime4K shaders must be installed under ~~/shaders.
glsl-shaders-append=~~/shaders/Anime4K_Clamp_Highlights.glsl;~~/shaders/Anime4K_Restore_CNN_M.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl
sub-font-size=42
sub-shadow-offset=1
